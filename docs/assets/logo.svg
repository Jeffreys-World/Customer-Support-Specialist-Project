<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 48" width="188" height="48" role="img" aria-label="Triage ticket console">
  <!-- Horizontal lockup for the expanded rail. Light on dark: this only ever
       renders against the dark navigation rail. NOTE: XML comments may not
       contain a double hyphen, so CSS custom property names are spelled out
       here rather than written literally. -->
  <rect width="48" height="48" rx="12" fill="#1F73B7"/>
  <rect x="11" y="13.5" width="19" height="4.5" rx="2.25" fill="#FFFFFF"/>
  <circle cx="35.5" cy="15.75" r="3.75" fill="#FFC24B"/>
  <rect x="11" y="21.75" width="14" height="4.5" rx="2.25" fill="#FFFFFF" fill-opacity="0.72"/>
  <rect x="11" y="30" width="9" height="4.5" rx="2.25" fill="#FFFFFF" fill-opacity="0.46"/>
  <text x="60" y="23.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3">Triage</text>
  <text x="60.5" y="35.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="7.5" font-weight="600" fill="#8FA9AD" letter-spacing="1.5">TICKET CONSOLE</text>
</svg>
